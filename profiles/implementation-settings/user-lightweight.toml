settings_version = "1.0.0"
profile_id = "user_lightweight"
profile_contract = "docs/contracts/profiles/user-lightweight.profile.json"
profile_contract_version = "1.0.0"
profile_role = "primary"
available_for_selection = true

[validation]
mode = "strict"
unknown_parameter = "error"
missing_contract = "error"
contract_version_mismatch = "error"
unsupported_parameter = "error"
composition_conflict = "error"

[authority]
profile_membership = "profile_contract"
component_membership = "profile_contract"
capabilities = "profile_contract"
resource_policy = "profile_contract"
security_policy = "profile_contract"
lifecycle_policy = "profile_contract"
offline_policy = "profile_contract"
external_integrations = "profile_contract"

[source_layout]
strategy = "shared_repository_tree"
profile_specific_source_tree = false
generated_output_root = "generated/profiles/user_lightweight"

[composition]
kind = "primary"
requires_base_profile = false
overlays = "explicit_only"
implicit_overlay_activation = false
compatibility_source = "profile_contract"
conflict_result = "error"

[implementation.host]
os_family = "maintained_linux"
desktop_mode = "general_purpose"
containers = "optional_rootless"
privileged_component_execution = false

[implementation.services]
activation = "required_resident_and_task_activated_workers"
maximum_concurrent_heavy_jobs = 1
heavy_java_services_at_boot = 0
idle_task_workers = 0
background_cpu_priority = "below_interactive"
background_io_priority = "below_interactive"

[implementation.network]
internal_default = "local_only"
remote_inbound_enabled_by_default = false
external_egress = "denied_except_declared_integrations"
provider_substitution = false

[implementation.offline]
continuity_claim = "core_local_operation"
internet_required_for_boot = false
remote_work_release_on_reconnection = "explicit_revalidation"
