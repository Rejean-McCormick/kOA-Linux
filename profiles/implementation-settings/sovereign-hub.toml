settings_version = "1.0.0"
profile_id = "sovereign_hub"
profile_contract = "docs/contracts/profiles/sovereign-hub.profile.json"
profile_contract_version = "1.0.0"
profile_role = "primary"
available_for_selection = true

[validation]
mode = "strict"
unknown_parameter = "error"
missing_contract = "error"
contract_version_mismatch = "error"
unsupported_parameter = "error"
composition_conflict = "error"

[authority]
profile_membership = "profile_contract"
component_membership = "profile_contract"
capabilities = "profile_contract"
resource_policy = "profile_contract"
security_policy = "profile_contract"
lifecycle_policy = "profile_contract"
offline_policy = "profile_contract"
external_integrations = "profile_contract"

[source_layout]
strategy = "shared_repository_tree"
profile_specific_source_tree = false
generated_output_root = "generated/profiles/sovereign_hub"

[composition]
kind = "primary"
requires_base_profile = false
overlays = "explicit_only"
implicit_overlay_activation = false
compatibility_source = "profile_contract"
conflict_result = "error"

[implementation.host]
os_family = "linux"
native_linux = true
maintained_distribution = true
encrypted_durable_storage = true
mandatory_access_control = true
immutable_signed_system_image = "recommended"
privileged_host_mutation = "disabled_by_default"

[implementation.topology]
default = "single_node"
supported = ["single_node", "small_cluster"]
cluster_membership = "explicit"
public_private_interfaces_separated = true
administration_interface_separated = true
federation_interface_separated = true
control_plane_required_for_local_operation = false

[implementation.containers]
required_for_every_component = false
preferred_runtime = "rootless_podman"
quadlet_preferred_for_single_node = true
privileged_by_default = false
read_only_root_filesystems_preferred = true

[implementation.network]
default = "deny"
internal_location_implies_trust = false
node_local_privileged_api = "unix_socket_preferred"
public_dns_required_for_local_correctness = false
online_time_required_for_local_correctness = false

[implementation.offline]
minimum_local_operation_without_internet = true
control_plane_required = false
external_ai_required = false
queued_remote_work_release = "explicit_revalidation"
