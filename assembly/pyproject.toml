[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "koa-assembly"
version = "0.1.0"
description = "Contract-driven assembly primitives for kOA-Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "kOA-Linux contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "referencing>=0.35,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
koa-assembly = "koa_assembly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koa_assembly"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
