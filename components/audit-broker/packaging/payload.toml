schema_version = "1.0.0"
payload_id = "audit-broker-component"
component_id = "audit_broker"
component_version = "1.0.0"
component_contract = "docs/contracts/components/audit-broker.component.json"
payload_class = "python-component"
source_root = "components/audit-broker"
public_api = "koa_audit_broker.api"
service_entrypoint = "koa_audit_broker.__main__:main"
generated = false

[authority]
source_state_owner = "source_component"
audit_state_owner = "audit_broker"
policy_decision_owner = "governance_policy_runtime"
identity_owner = "identity_and_trust"
cross_domain_publication_owner = "publication_gateway"
direct_cross_component_database_access = false
native_or_automatic_external_ai = false

[installation]
code_root = "/usr/lib/koa/active/services/audit"
configuration_root = "/etc/koa/components/audit-broker"
state_root = "/var/lib/koa/audit"
runtime_root = "/run/koa/audit"
cache_root = "/var/cache/koa/audit"
socket_path = "/run/koa/sockets/audit-broker.sock"

[[include]]
source = "src/koa_audit_broker"
destination = "python/koa_audit_broker"
kind = "tree"
mutable = false

[[include]]
source = "migrations"
destination = "migrations"
kind = "tree"
mutable = false

[[interface]]
interface_id = "submit_audit_event"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "request_audit_disclosure"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "apply_retention_action"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "invalidate_audit_record"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "get_audit_record_metadata"
version = "1.0.0"
interaction = "query"

[[interface]]
interface_id = "get_audit_request_status"
version = "1.0.0"
interaction = "query"

[[interface]]
interface_id = "get_audit_health"
version = "1.0.0"
interaction = "query"
