{
  "schema_version": 1,
  "package_set_id": "koa.host.base-packages",
  "profile_id": "sovereign_linux_node",
  "package_manager_specific": false,
  "required_capabilities": [
    {
      "id": "kernel",
      "purpose": "bootable Linux kernel and modules"
    },
    {
      "id": "init-system",
      "purpose": "system and service supervision"
    },
    {
      "id": "boot-verification",
      "purpose": "verified boot artifact loading"
    },
    {
      "id": "filesystem-tools",
      "purpose": "declared filesystem creation and inspection"
    },
    {
      "id": "encryption-tools",
      "purpose": "profile-declared encrypted storage"
    },
    {
      "id": "network-policy",
      "purpose": "host firewall and network boundary enforcement"
    },
    {
      "id": "trust-store",
      "purpose": "system trust anchors and revocation inputs"
    },
    {
      "id": "python-runtime",
      "purpose": "host lifecycle utilities"
    }
  ],
  "prohibited_contents": [
    "private_signing_keys",
    "deployment_secrets",
    "component_databases",
    "component_queues",
    "activation_receipts",
    "user_content",
    "build_caches",
    "mutable_runtime_state"
  ],
  "resolution_rule": "A profile or distribution adapter must provide an exact package plan; materialize-rootfs.py verifies source admission, version, digest, and local artifact identity before build-rootfs.py is invoked.",
  "prohibited_path_prefixes": [
    "etc/koa/secrets.d",
    "run/koa",
    "var/cache/koa",
    "var/cache/koa-build",
    "var/lib/koa",
    "var/lib/koa-recovery",
    "home",
    "root"
  ],
  "resolution_contract": {
    "materializer": "host/image/materialize-rootfs.py",
    "package_sources": "packaging/system/package-sources.toml",
    "required_fields": [
      "package_id",
      "version",
      "sha256",
      "source_id",
      "source_ref",
      "artifact_path",
      "owner",
      "trust_scope",
      "provenance_ref",
      "admission_checks",
      "evidence_refs"
    ],
    "exact_version_required": true,
    "content_digest_required": true,
    "source_admission_required": true,
    "network_resolution_allowed": false
  }
}
