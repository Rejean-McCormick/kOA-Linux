[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "koa-linux"
version = "0.1.0"
description = "Repository-local tooling workspace for kOA-Linux"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
koa = "koa_tools.cli:main"

[dependency-groups]
runtime = []
development = [
  "pre-commit==4.3.0",
]
test = [
  "jsonschema>=4.26,<5",
  "koa-interfaces>=1.0,<2.0",
  "koa-konnaxion-adapter==0.1.0",
  "koa-resource-governor==1.0.0",
  "koa-sentient-adapter==1.0.0",
  "pytest==9.0.3",
]
quality = [
  "mypy==1.17.1",
  "ruff==0.12.12",
]
build = []


[tool.uv.sources]
koa-interfaces = { path = "interfaces/python" }
koa-konnaxion-adapter = { path = "integrations/konnaxion/adapter" }
koa-resource-governor = { path = "components/resource-governor" }
koa-sentient-adapter = { path = "integrations/sentient/adapter" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.sdist]
include = [
  "tools/src/koa_tools",
  "README.md",
  "SECURITY.md",
  "NOTICE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["tools/src/koa_tools"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tools/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tools/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "tools/src"
packages = ["koa_tools"]
