schema_version = "1.0.0"
payload_id = "publication-gateway-component"
component_id = "publication_gateway"
component_version = "1.0.0"
component_contract = "docs/contracts/components/publication-gateway.component.json"
publication_request_schema = "docs/contracts/artifact-contracts/publication-request.schema.json"
publication_receipt_schema = "docs/contracts/artifact-contracts/publication-receipt.schema.json"
payload_class = "python-component"
source_root = "components/publication-gateway"
public_api = "koa_publication_gateway.api"
service_entrypoint = "koa_publication_gateway.__main__:main"
generated = false

[authority]
publication_request_owner = "publication_gateway"
publication_decision_owner = "publication_gateway"
bounded_representation_owner = "publication_gateway"
publication_receipt_owner = "publication_gateway"
source_state_owner = "source_component"
destination_state_owner = "destination_component_or_external_platform"
identity_owner = "identity_and_trust"
policy_authority_owner = "governance_policy_runtime"
audit_evidence_owner = "audit_broker"
resource_authority_owner = "resource_governor"
direct_cross_component_database_access = false
authority_transfer_by_publication = false
partial_delivery_as_success = false
automatic_external_provider_selection = false
native_or_automatic_external_ai = false

[installation]
code_root = "/usr/lib/koa/active/services/publication-gateway"
configuration_root = "/etc/koa/components/publication-gateway"
state_root = "/var/lib/koa/publication-gateway"
runtime_root = "/run/koa/publication"
receipt_root = "/var/lib/koa/receipts/publication-gateway"
staging_root = "/var/lib/koa/publication-gateway/staging"
cache_root = "/var/cache/koa/publication-gateway"
socket_path = "/run/koa/sockets/publication-gateway.sock"

[[include]]
source = "src/koa_publication_gateway"
destination = "python/koa_publication_gateway"
kind = "tree"
mutable = false

[[include]]
source = "migrations"
destination = "migrations"
kind = "tree"
mutable = false

[[interface]]
interface_id = "publication_request"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "revocation_or_withdrawal_notice"
version = "1.0.0"
interaction = "command"

[[interface]]
interface_id = "publication_status_query"
version = "1.0.0"
interaction = "query"

[[interface]]
interface_id = "health"
version = "1.0.0"
interaction = "query"

[[interface]]
interface_id = "queue_inspection"
version = "1.0.0"
interaction = "query"

[[interface]]
interface_id = "controlled_retry"
version = "1.0.0"
interaction = "command"
