manifest_version = "1.0.0"
component_id = "koa_node_agent"
component_contract = "docs/contracts/components/koa-node-agent.component.json"
component_contract_version = "1.0.0"
artifact_class = "component_package"

[entrypoints]
node_agent = "/usr/libexec/koa/koa-node-agent"
privileged_broker = "/usr/libexec/koa/koa-privileged-broker"
operator_cli = "/usr/bin/koa-node-agentctl"

[transport]
node_agent = "authenticated_local_unix_socket"
node_agent_socket = "/run/koa/sockets/koa-node-agent.sock"
privileged_broker = "authenticated_local_unix_socket"
privileged_broker_socket = "/run/koa/sockets/koa-privileged-broker.sock"
public_network_listener = false

[paths]
configuration = "/etc/koa/components/koa-node-agent/config.toml"
operation_catalog = "/etc/koa/node/privileged-operation-catalog.json"
persistent_state = "/var/lib/koa/node"
activation_receipts = "/var/lib/koa/node/activation-receipts"

[operation_catalog]
source = "docs/contracts/components/koa-node-agent.component.json#/operation_model/operation_classes"
closed = true
unregistered_operation_result = "rejected"
caller_supplied_executable = false
caller_supplied_service_unit = false
caller_supplied_host_path = false

[[payload]]
source = "target/release/koa-node-agent"
destination = "/usr/libexec/koa/koa-node-agent"
class = "immutable_executable"
mode = "0755"

[[payload]]
source = "target/release/koa-privileged-broker"
destination = "/usr/libexec/koa/koa-privileged-broker"
class = "immutable_executable"
mode = "0755"

[[payload]]
source = "target/release/koa-node-agentctl"
destination = "/usr/bin/koa-node-agentctl"
class = "immutable_executable"
mode = "0755"

[privilege_boundary]
ordinary_node_agent_is_privileged_executor = false
privileged_broker_is_separate_process = true
minimum_privilege_required = true
profile_defined_execution_identity = true
local_authenticated_transport_only = true

[boundaries]
arbitrary_shell_execution = false
arbitrary_service_manager_control = false
arbitrary_file_copy = false
path_traversal = false
arbitrary_container_execution = false
generic_package_manager_access = false
unrestricted_device_access = false
raw_private_key_export = false
direct_cross_component_database_writes = false
runtime_secrets_in_payload = false
generated_content_is_authority = false
