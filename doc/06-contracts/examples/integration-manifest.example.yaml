schema_version: "1.0"
integration_id: "annex:example-deliberation-tool"
version: "2.4.0"
owner: "team:konnaxion"
mode: "annex-isolated"
trust_level: "untrusted"
network:
  inbound: []
  outbound:
    - "https://api.example.invalid"
filesystem:
  read: []
  write:
    - "/var/lib/koa/integrations/example"
data_classes:
  allowed: ["public"]
  forbidden: ["confidential", "restricted", "sealed", "cultural-sensitive"]
capabilities:
  ai_access: false
  publish: false
  vote_authority: false
offline_behavior: "unavailable-without-impact-on-core"
failure_mode: "isolated"
healthcheck: "/healthz"
export_support: true
removal_plan: "Delete container, volume, credentials and route registration."
