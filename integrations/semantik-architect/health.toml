schema_version = "1.0.0"

[transport]
kind = "http_over_unix"
socket_path = "/run/koa/semantik-architect/adapter.sock"
liveness_path = "/health"
readiness_path = "/ready"
health_schema = "interfaces/health/health-status.schema.json"
readiness_schema = "interfaces/health/readiness.schema.json"

[liveness]
meaning = "adapter_process_can_respond"
failure_result = "unhealthy"
grants_authority = false

[readiness]
meaning = "adapter_can_accept_declared_operations"
required_conditions = [
  "source_is_pinned",
  "compatibility_is_accepted",
  "subsystem_endpoint_is_declared",
  "identity_and_trust_is_available",
  "governance_policy_runtime_is_available",
  "audit_broker_is_available",
  "resource_admission_is_available"
]
missing_condition_result = "not_ready"
grants_authority = false

[dependency_states]
subsystem_unavailable = "degraded"
source_unpinned = "blocked"
contract_incompatible = "blocked"
authority_indeterminate = "blocked"
resource_denied = "degraded"

[observability]
correlation_id_required = true
secret_values_allowed = false
source_payloads_allowed = false
compiled_payloads_allowed = false
