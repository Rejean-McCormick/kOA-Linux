schema_version = "1.0.0"
integration_id = "uckk"
backup_owner = "koa_operations"
coordination_mode = "owner_separated"

[koa_boundary]
included = [
  "source_lock",
  "compatibility_declaration",
  "integration_configuration",
  "deployment_configuration",
  "resource_envelope",
  "health_configuration",
  "storage_boundary",
  "degradation_configuration",
  "directional_queue_metadata",
  "workflow_state",
  "receipt_references",
  "dead_letter_references",
]
excluded = [
  "secrets",
  "credentials",
  "raw_private_keys",
  "uckk_database",
  "uckk_moodle_storage",
  "koa_mediatheque_payloads",
  "other_component_authoritative_state",
]

[publication]
source_media_backup_owner = "koa_mediatheque"
pending_package_policy = "retain_only_while_authorization_and_source_version_remain_revalidatable"
restore_revalidates_authorization = true
restore_never_marks_remote_success = true

[import]
quarantine_payload_policy = "profile_and_license_defined"
accepted_content_backup_owner = "koa_mediatheque"
restore_of_quarantine_grants_acceptance = false
restore_preserves_source_and_license_evidence = true

[restore]
source_pin_reverification_required = true
compatibility_reverification_required = true
profile_membership_reverification_required = true
resource_admission_reverification_required = true
receipt_path_reverification_required = true
partial_restore_activation_allowed = false
failed_validation_result = "integration_disabled"

[evidence]
backup_receipt_required = true
restore_receipt_required = true
secret_material_in_receipts_allowed = false
