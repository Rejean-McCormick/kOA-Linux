"$schema" = "contracts/artifact-contracts/resource-envelope.schema.json"
schema_version = "1.0.0"
envelope_id = "REN-ARIANE-RUNTIME-001"
version = "1.0.0"
status = "active"
language = "en"
title = "Ariane Runtime profile-resolved resource boundary"
description = "Component boundary for interactive Ariane work. Concrete quantities are supplied by the active profile and may only narrow this envelope."
envelope_kind = "component_budget"
effective_at = "2026-08-06T00:00:00Z"
canonical_refs = [
  "docs/contracts/subsystems/ariane.subsystem.json",
  "docs/02-system/11-ariane-system-boundary.md",
  "docs/08-operations/04-resource-envelopes.md",
]
decision_ids = ["DEC-ARI-001"]
requirement_ids = ["REQ-ARI-EXP-023", "REQ-ARI-EXP-024"]
lock_ids = ["LOCK-ARI-001", "LOCK-ARI-002"]
tags = ["ariane", "interactive", "profile-resolved"]

[scope]
target_type = "component"
target_id = "ariane_runtime"
profile_ids = ["user_lightweight", "sovereign_linux_node"]
environment = "production"
component_id = "ariane_runtime"
[scope.labels]
workload = "interactive"
capability = "local_navigation"
selector_expression = "active profile includes Ariane and supplies concrete resource quantities"

[ownership]
declaring_owner = "docs/contracts/subsystems/ariane.subsystem.json"
enforcement_owner_component_id = "resource_governor"
enforcement_contract_ref = "contracts/components/resource-governor.component.json"
resource_authority = "resource_limits_only"
authorization_effect = "none"
consent_effect = "none"
disclosure_effect = "none"
machine_privilege_effect = "none"
cross_component_data_write = "prohibited"
governance_policy_usage = "activation_authorization_only"

[composition]
composition_mode = "standalone"
merge_strategy = "narrow_limits"
implicit_inheritance = "prohibited"
conflict_result = "blocked"
child_overcommit = "prohibited"

[resources.concurrency]
global_max_active = 8
admission_accounting = "required"

[[resources.concurrency.limits]]
limit_id = "interactive_sessions"
workload_class = "interactive"
max_active = 8
max_per_identity = 1
max_per_component = 8
overflow_behavior = "queue"
fairness_key = "identity"

[scheduling]
workload_class = "interactive"
priority = 100
admission = "profile_defined"
preemption = "emergency_only"
fairness = "identity_fair"
resource_pressure_behavior = "shed_optional_work"
scheduling_group = "ariane_interactive"
authorization_effect = "none"

[activation]
mode = "profile_defined"
always_on_allowed = true
start_condition = "profile_defined"
idle_shutdown = "profile_defined"
max_warm_instances = 1
startup_failure_behavior = "capability_unavailable"
shutdown_behavior = "graceful_then_stop"

[degradation]
default_behavior = "shed_optional_then_stop"
automatic_recovery = true
revalidation_required = true
recovery_stability_duration = "PT30S"
silent_limit_expansion = "prohibited"
policy_authority = "none"
last_verified_envelope_behavior = "continue_within_last_verified_limits"

[[degradation.steps]]
step_id = "pause_optional_background_work"
order = 1
action = "pause_optional_work"
target = "ariane_optional_background_work"
authority_effect = "none"
status_effect = "constrained"
preserved_capabilities = ["ariane_observation", "ariane_confirmation", "ariane_cancellation", "ariane_recovery"]
denied_work = ["optional_prefetch", "optional_index_refresh"]
recovery_condition = "The active profile reports stable capacity within its admitted thresholds."
receipt_required = true

[degradation.steps.trigger]
metric = "active_concurrency_percent"
comparison = "greater_than_or_equal"
threshold = 90
sustain_for = "PT5S"

[enforcement]
artifact_mode = "embedded_contract"
enforcement_level = "soft_with_hard_ceiling"
verification_frequency = "on_activation"
drift_behavior = "stop_new_work"
missing_backend_behavior = "deny_start"
policy_runtime_substitution = "prohibited"
direct_host_privilege = "prohibited_outside_declared_broker"
enforcement_receipt_required = true

[[enforcement.backends]]
backend_id = "profile_selected_backend"
backend_type = "equivalent"
resources = ["cpu", "memory", "io", "processes", "concurrency", "queues", "time"]
support_level = "measured_with_external_enforcement"
privileged = false
configuration_ref = "profiles/implementation-settings/"
failure_behavior = "deny_start"

[observability]
health_states = ["healthy", "constrained", "degraded", "paused", "unavailable", "recovering"]
correlation_required = true
secret_material_allowed = false
status_accuracy = "degraded_state_must_not_appear_healthy"

[observability.sampling]
mode = "continuous"

[[observability.metrics]]
metric_id = "ariane_resource_state"
resource = "health"
unit = "state"
required = true
aggregation = "state"
labels = ["profile_id", "capability_id"]

[[observability.metrics]]
metric_id = "ariane_active_concurrency"
resource = "concurrency"
unit = "count"
required = true
aggregation = "gauge"
labels = ["profile_id"]

[lifecycle]
activation_mode = "atomic_or_equivalent"
partial_activation = "prohibited"
rollback_or_forward_repair = "rollback_then_forward_repair"
previous_verified_envelope_retained = true
runtime_states = ["verified", "staged", "active", "constrained", "superseded", "recovering"]

[lifecycle.retention]
active_envelope = "P3650D"
previous_verified_envelope = "P3650D"
allocation_receipts = "P365D"
enforcement_receipts = "P365D"
degradation_receipts = "P365D"
recovery_evidence = "P365D"

[receipts]
receipt_schema_ref = "contracts/artifact-contracts/decision-receipt.schema.json"
required_transition_classes = ["envelope_activation", "envelope_rejection", "admission", "degradation", "recovery"]
required_fields = ["receipt_id", "envelope_id", "envelope_version", "target_type", "target_id", "profile_ids", "transition_class", "result_state", "reason_codes", "occurred_at", "correlation_id"]
public_content = ["receipt_id", "envelope_id", "envelope_version", "target_type", "transition_class", "result_state", "reason_codes", "occurred_at", "correlation_id"]
private_evidence_content = ["target_identity", "node_identity", "backend_configuration", "diagnostic_evidence"]
correlation_required = true
secret_material_allowed = false

[validation]
required_checks = ["schema_validation", "canonical_reference_resolution", "scope_resolution", "owner_resolution", "profile_scope_alignment", "component_scope_alignment", "concurrency_bound_validation", "backend_resource_coverage", "backend_capability_validation", "degradation_order_validation", "safe_recovery_validation", "observability_coverage", "receipt_schema_alignment", "retention_validation", "resource_governor_boundary", "no_authorization_effect", "no_machine_privilege_effect"]
test_ids = ["TEST-ARI-RESOURCE-ENVELOPE-001"]
evidence_ids = ["EVID-ARI-RESOURCE-ENVELOPE-001"]
activation_requires = "pass"
missing_required_result = "blocked"
automatic_semantic_fixes_allowed = false
