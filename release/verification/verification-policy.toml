schema_version = "1.0"
policy_id = "koa.release-verification.policy"
status = "active"
authority = "docs/06-lifecycle/12-artifact-verification.md"
signing_policy_ref = "release/signing/policy.toml"
roles_ref = "release/signing/roles.toml"
offline_policy_ref = "release/signing/offline-signing.toml"
release_set_schema_ref = "docs/contracts/artifact-contracts/release-set.schema.json"
release_channels_contract_ref = "docs/contracts/release-channels.contract.json"

[input]
maximum_json_bytes = 16777216
maximum_signature_count = 32
maximum_trust_key_count = 256
require_utf8 = true
reject_duplicate_json_keys = true
reject_non_finite_numbers = true
reject_unknown_signature_fields = true
reject_unknown_statement_fields = true
repository_confined_references = true
reject_symlink_escape = true

[release_set]
required_artifact_class = "release_set"
required_channels = ["system", "services", "governance", "knowledge"]
require_schema_validation = true
require_all_profile_results_pass = true
require_all_constraint_results_pass = true
require_test_evidence = true
require_activation_evidence = true
require_provenance = true
reject_revoked_or_rejected = true

[trust]
trust_bundle_digest_pin_required = true
trust_bundle_expiry_required = true
revocation_snapshot_expiry_required = true
require_key_role_match = true
require_key_algorithm_match = true
require_key_scope_match = true
require_key_validity = true
require_key_not_revoked = true
minimum_trust_epoch_input_required = true
minimum_revocation_sequence_input_required = true
minimum_release_sequence_input_required = true
maximum_future_clock_skew_seconds = 0

[crypto]
backend = "python-cryptography"
accepted_algorithms = ["ed25519", "ecdsa-p256-sha256", "rsa-pss-sha256"]
minimum_rsa_bits = 3072
allowed_ec_curves = ["secp256r1"]

[output]
format_version = "1.0"
default_format = "text"
json_sort_keys = true
include_authority_paths = true
include_verified_signature_ids = true
include_subject_digest = true
include_private_key_material = false
include_public_key_material = false
success_exit_code = 0
verification_failure_exit_code = 1
usage_or_configuration_exit_code = 2
