# Persistent roots owned by internal kOA components.
# No shared writable database root is created.

d /var/lib/koa                             0755 root                          root                          -
d /var/lib/koa/audit                       0750 koa-audit-broker              koa-audit-broker              -
d /var/lib/koa/identity-and-trust          0750 koa-identity-and-trust        koa-identity-and-trust        -
d /var/lib/koa/kristal                     0750 koa-kristal-runtime           koa-kristal-runtime           -
d /var/lib/koa/mediatheque                 0750 koa-mediatheque               koa-mediatheque               -
d /var/lib/koa/node                        0750 koa-node-agent                koa-node-agent                -
d /var/lib/koa/node/activation-receipts    0750 koa-node-agent                koa-node-agent                -
d /var/lib/koa/policies                    0750 koa-governance-policy-runtime koa-governance-policy-runtime -
d /var/lib/koa/publication-gateway         0750 koa-publication-gateway       koa-publication-gateway       -
d /var/lib/koa/receipts                    0750 koa-audit-broker              koa-audit-broker              -
d /var/lib/koa/resource-governor           0750 koa-resource-governor         koa-resource-governor         -
