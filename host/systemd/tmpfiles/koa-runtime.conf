# Ephemeral kOA runtime roots. They contain only sockets, locks, health and
# bounded transition state and are recreated at boot.

d /run/koa             0755 root root -
d /run/koa/activation  0750 root root -
d /run/koa/health      0750 root root -
d /run/koa/locks       0750 root root -
d /run/koa/recovery    0750 root root -
d /run/koa/sockets     0755 root root -
