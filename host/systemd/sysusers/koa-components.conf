# kOA-Linux component service identities.
# Canonical state roots: .koa/runtime-paths.json and DOC-SYS-032.
# Accounts are system-only, have no fixed numeric ID, and cannot log in.

u koa-audit-broker              - "kOA Audit Broker"                /var/lib/koa/audit               /usr/sbin/nologin
u koa-governance-policy-runtime - "kOA Governance Policy Runtime"  /var/lib/koa/policies            /usr/sbin/nologin
u koa-identity-and-trust        - "kOA Identity and Trust"          /var/lib/koa/identity-and-trust  /usr/sbin/nologin
u koa-kristal-runtime           - "kOA Kristal Runtime"             /var/lib/koa/kristal             /usr/sbin/nologin
u koa-mediatheque               - "kOA Mediatheque"                 /var/lib/koa/mediatheque         /usr/sbin/nologin
u koa-node-agent                - "kOA Node Agent"                  /var/lib/koa/node                /usr/sbin/nologin
u koa-publication-gateway       - "kOA Publication Gateway"         /var/lib/koa/publication-gateway /usr/sbin/nologin
u koa-resource-governor         - "kOA Resource Governor"           /var/lib/koa/resource-governor   /usr/sbin/nologin
