schema_version = "1.0.0"
session_id = "koa_appliance_ordinary"
config_kind = "session"
profile_overlay = "appliance_shell"
session_mode = "interactive_user"
display_protocol = "wayland"

[authority]
requires_handoff = false
required_context = "ordinary"
separate_authentication = false
direct_privileged_broker_access = false
privileged_effects = "none"
critical_transition_receipt_required = false
max_handoff_ttl_seconds = 0

[entrypoint]
executable = "/usr/libexec/koa/koa-appliance-session"
arguments = []
start_state = "locked"

[runtime]
directory_name = "appliance-ordinary"
mode = "0700"
clean_on_start = true
clean_on_exit = true
reject_symlinks = true
required_surface_roles = ["compositor", "native_shell"]
optional_surface_roles = ["embedded_web_engine"]
required_native_capabilities = ["status", "recovery", "accessibility", "session_exit", "safe_maintenance"]

[environment]
inherit = ["LANG", "LC_ALL", "LC_CTYPE", "XDG_RUNTIME_DIR", "WAYLAND_DISPLAY"]
clear_unlisted = true
profile_overlay = "appliance_shell"
session_mode = "interactive_user"

[supervision]
max_restarts = 2
restart_window_seconds = 30
termination_grace_seconds = 5
crash_return_state = "locked"
integrity_failure_action = "request_recovery"

[cleanup]
remove_runtime_tree = true
preserve_authoritative_state = true
release_devices = "external_owner"
unmount_media = "external_owner"

[presentation]
visible_mode_indicator = false
maintenance_controls_visible = false
recovery_controls_visible = false
status_and_exit_controls_required = true
route_authority = "active_component_profile_policy_and_session_state"
