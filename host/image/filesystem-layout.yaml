{
  "schema_version": 1,
  "layout_id": "koa.host.filesystem-layout",
  "immutable_roots": ["/usr", "/opt/koa"],
  "host_configuration_roots": ["/etc/koa"],
  "runtime_roots": ["/run/koa"],
  "mutable_state_roots": ["/var/lib/koa", "/var/cache/koa"],
  "component_owned_state_prefix": "/var/lib/koa/components",
  "entries": [
    {"path": "/etc/koa", "kind": "directory", "mode": "0755", "owner": "root", "group": "root"},
    {"path": "/opt/koa", "kind": "directory", "mode": "0755", "owner": "root", "group": "root"},
    {"path": "/run/koa", "kind": "directory", "mode": "0755", "owner": "root", "group": "root", "runtime_only": true},
    {"path": "/var/cache/koa", "kind": "directory", "mode": "0750", "owner": "root", "group": "root", "mutable": true},
    {"path": "/var/lib/koa", "kind": "directory", "mode": "0750", "owner": "root", "group": "root", "mutable": true},
    {"path": "/var/lib/koa/boot", "kind": "directory", "mode": "0700", "owner": "root", "group": "root", "mutable": true},
    {"path": "/var/lib/koa/components", "kind": "directory", "mode": "0750", "owner": "root", "group": "root", "mutable": true, "component_owned": true}
  ],
  "image_exclusions": [
    "/run/koa",
    "/var/cache/koa",
    "/var/lib/koa/boot",
    "/var/lib/koa/components"
  ]
}
