{
  "schema_version": 1,
  "policy_id": "koa-host-lsm",
  "version": "1.0.0",
  "status": "active",
  "profile": "sovereign_linux_node",
  "default_action": "deny",
  "controls": [
    "SEC-INV-002",
    "SEC-INV-003",
    "SEC-INV-005",
    "SEC-PRIV-001",
    "SEC-PRIV-002",
    "SEC-PRIV-003",
    "SEC-ISO-002"
  ],
  "authority": {
    "policy_owner": "host_platform",
    "identity_owner": "identity_and_trust",
    "privileged_executor": "koa_node_agent",
