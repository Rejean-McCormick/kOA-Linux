        "identity_runtime"
      ],
      "execute_objects": [],
      "connect_sockets": [
        "audit_socket"
      ],
      "network_families": [
        "unix"
      ],
      "capability_mode": "none",
      "ptrace": false,
      "arbitrary_exec": false,
      "accept_sockets": [
        "identity_runtime"
      ]
    },
    {
      "id": "koa_node_agent",
      "service_identity": "koa-node-agent",
      "apparmor_profile": "koa.koa-node-agent",
      "selinux_type": "koa_node_agent_t",
