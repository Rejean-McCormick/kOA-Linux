      "id": "runtime_libraries",
      "class": "immutable",
      "managed_label": false,
      "selinux_type": "lib_t",
      "apparmor_read": [
        "/etc/ld.so.cache",
        "/etc/nsswitch.conf",
        "/etc/passwd",
        "/etc/group",
        "/lib/**",
        "/lib64/**",
        "/usr/lib/**",
        "/usr/lib64/**"
      ],
      "selinux_file_contexts": []
    },
    {
      "id": "koa_immutable",
      "class": "immutable",
      "managed_label": true,
      "selinux_type": "koa_immutable_t",
      "apparmor_read": [
        "/usr/lib/koa/**",
        "/usr/share/koa/**"
      ],
      "selinux_file_contexts": [
        "/usr/lib/koa(/.*)?",
        "/usr/share/koa(/.*)?"
      ]
    },
    {
      "id": "broker_helpers",
      "class": "executable",
      "managed_label": true,
      "selinux_type": "koa_broker_helper_exec_t",
