  "backend": {
    "apparmor_profile_prefix": "koa.",
    "selinux_module_name": "koa_host",
    "selinux_module_version": "1.0.0",
    "capability_composition": "external_bounding_set",
    "unknown_object_result": "reject",
    "unknown_domain_result": "reject"
